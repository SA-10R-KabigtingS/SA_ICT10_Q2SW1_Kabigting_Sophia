<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidate Verification System</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- PyScript -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f3f0ee, #f49030);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .verify-card {
      max-width: 480px;
      width: 100%;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .verify-card .card-header {
      background: 	#ef863d;
      color: #35364a;
      text-align: center;
      border-radius: 16px 16px 0 0;
      padding: 20px;
    }
    #result { min-height: 70px; }
  </style>
</head>
<body>

  <div class="card verify-card">
    <div class="card-header">
      <h3 class="mb-0">Karasuno High: Volleyball Club</h3>
      <small>Candidate Verification System</small>
    </div>

    <div class="card-body p-4">
      <div class="mb-3">
        <label for="first_name" class="form-label fw-semibold">First Name</label>
        <input type="text" id="first_name" class="form-control" placeholder="Enter first name">
      </div>

      <div class="mb-3">
        <label for="last_name" class="form-label fw-semibold">Last Name</label>
        <input type="text" id="last_name" class="form-control" placeholder="Enter last name">
      </div>

      <button id="verify_btn" class="btn btn-primary w-100 py-2" py-click="check_candidate">
        Verify Candidate
      </button>

      <div id="result" class="alert alert-secondary mt-4 mb-0 text-center d-flex align-items-center justify-content-center">
        Your result will appear here.
      </div>
    </div>
  </div>

  <script type="py">
    from pyscript import document

    # List of club members (stored in Title Case)
    club_members = [
        "Shoyo Hinata",
        "Tobio Kageyama",
        "Kei Tsukishima",
        "Tadashi Yamaguchi",
        "Ryunosuke Tanaka",
        "Yu Nishinoya",
        "Daichi Sawamura",
        "Koshi Sugawara",
    ]

    # Index 0 -> False (not on list), Index 1 -> True (on list)
    # Using the boolean result as an index avoids if/else and loops.
    messages = [
        "Sorry {name}, your name is not on the list.",
        "Congratulations {name}! You are now part of the Volleyball club.",
    ]
    alert_classes = ["alert alert-danger", "alert alert-success"]

    def check_candidate(event):
        # Step 3: get first and last name, combine into a full name
        first_name = document.querySelector("#first_name").value.strip().title()
        last_name = document.querySelector("#last_name").value.strip().title()
        full_name = f"{first_name} {last_name}"

        # Step 4: check membership and store result in a variable
        is_member = full_name in club_members

        # Step 5: display message based on result (no conditionals or loops)
        result_area = document.querySelector("#result")
        result_area.innerText = messages[is_member].format(name=full_name)
        result_area.className = alert_classes[is_member] + " mt-4 mb-0 text-center d-flex align-items-center justify-content-center"
  </script>

</body>
</html>
